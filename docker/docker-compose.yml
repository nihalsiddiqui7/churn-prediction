services:
  mlflow:
    image: python:3.10-slim
    working_dir: /workspace
    volumes:
      - ..:/workspace
      - ../mlruns:/mlruns
    ports:
      - "5000:5000"
    command: >
      sh -c "pip install mlflow && mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlruns"